services:
  - type: web
    name: atlas-agent
    runtime: node
    region: oregon
    rootDir: server
    buildCommand: npm install
    startCommand: npx tsx src/server.ts
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: llama-3.1-8b-instant
      - key: NODE_ENV
        value: production
      - key: PROBE_PORT
        value: 3001
